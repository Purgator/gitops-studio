pluginGroup = io.github.purgator.gitops
pluginName = GitOps Studio
pluginVersion = 0.2.0

# Oldest IDE build the plugin supports (263 = 2026.3).
pluginSinceBuild = 263
# IDE downloaded to compile against when no local IDE is configured (see local.properties / README).
platformVersion = 2026.3

kotlin.stdlib.default.dependency = false
kotlin.code.style = official
org.gradle.caching = true
org.gradle.configuration-cache = true
org.gradle.jvmargs = -Xmx2g -Dfile.encoding=UTF-8
